name: Backend Guardian CI

on:
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql+asyncpg://codify:codify@localhost:5432/codifylive_test
  SECRET_KEY: test-secret-not-real
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  PRODUCTION: "False"
  GOOGLE_CLIENT_ID: test-client-id
  GOOGLE_CLIENT_SECRET: test-client-secret


jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: codify
          POSTGRES_PASSWORD: codify
          POSTGRES_DB: codifylive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://codify:codify@${{ env.POSTGRES_HOST }}:5432/codifylive_test

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      # no test yet uncooment once added
