name: Publish API Docs

'on':
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -
                uses: actions/checkout@v4
            -
                name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'
                    cache: pip
                    cache-dependency-path: requirements.txt
            -
                name: Install Dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            -
                name: Generate OpenAPI schema
                env:
                    DATABASE_URL: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder
                    SECRET_KEY: placeholder
                    ALGORITHM: HS256
                    ACCESS_TOKEN_EXPIRE_MINUTES: '15'
                    REFRESH_TOKEN_EXPIRE_DAYS: '7'
                    PRODUCTION: 'false'
                    GOOGLE_CLIENT_ID: placeholder
                    GOOGLE_CLIENT_SECRET: placeholder
                    ORIGINS: placeholder
                    GOOGLE_REDIRECT_URI: placeholder
                    GOOGLE_AUTHORIZE_URL: placeholder
                    GOOGLE_TOKEN_URL: placeholder
                    GOOGLE_SCOPES: placeholder
                    FRONTEND_URL: placeholder
                run: |
                    mkdir -p _site
                    python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > _site/openapi.json
            -
                name: Build docs page
                run: |
                    cat > _site/index.html <<'HTML'
                    <!doctype html>
                    <html lang="en">
                      <head>
                        <meta charset="utf-8" />
                        <meta name="viewport" content="width=device-width, initial-scale=1" />
                        <title>CodifyLive API</title>
                        <link
                          rel="stylesheet"
                          href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css"
                        />
                        <style>
                          body { margin: 0; }
                          .swagger-ui .topbar { display: none; }
                        </style>
                      </head>
                      <body>
                        <div id="swagger-ui"></div>
                        <script
                          src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"
                          crossorigin
                        ></script>
                        <script>
                          window.ui = SwaggerUIBundle({
                            url: './openapi.json',
                            dom_id: '#swagger-ui',
                            deepLinking: true,
                            supportedSubmitMethods: [],
                          });
                        </script>
                      </body>
                    </html>
                    HTML
            -
                name: Upload Pages artifact
                uses: actions/upload-pages-artifact@v3
                with:
                    path: _site

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: '${{ steps.deployment.outputs.page_url }}'
        steps:
            -
                name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v4
